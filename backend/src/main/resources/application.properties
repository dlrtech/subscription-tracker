spring.application.name=subscription-tracker

# Optional, git-ignored overrides for local development (see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties

# --- Database (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/subscription_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Security ---
# Required: at least 32 characters. Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
# Short-lived access token; the browser renews it with the long-lived refresh cookie.
app.jwt.expiration=${JWT_EXPIRATION:PT15M}
app.jwt.issuer=subscription-tracker
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Refresh-token cookie. A frontend and API on different sites need SameSite=None + Secure.
# For plain-http local development set COOKIE_SECURE=false and COOKIE_SAMESITE=Lax.
app.auth.refresh-expiration=${REFRESH_EXPIRATION:P30D}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.cookie-same-site=${COOKIE_SAMESITE:None}

# Max requests per client address and endpoint for login/register/password-reset endpoints.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:10}
app.rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}

# Trust the proxy's X-Forwarded-* headers so the real client address is seen (Render, Docker behind a proxy).
server.forward-headers-strategy=framework

# --- E-mail (verification, password reset, payment reminders) ---
# Set SPRING_MAIL_HOST (plus SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD) to send real
# e-mail. Without a host, e-mails are written to the application log instead of being sent.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:subtracker <no-reply@localhost>}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Payment reminders go out every morning at 09:00 (server time zone).
app.reminders.cron=0 0 9 * * *

# --- Exchange rates for the converted total (free ECB data, no API key) ---
app.exchange.url=${EXCHANGE_URL:https://api.frankfurter.dev/v1/latest}

# --- Application ---
app.default-currency=${DEFAULT_CURRENCY:TRY}
# Runs every night at 00:05 to move passed billing dates forward.
app.billing.update-cron=0 5 0 * * *

# --- Operations ---
management.endpoints.web.exposure.include=health
# An SMTP outage must not make the platform health check fail.
management.health.mail.enabled=false
server.error.include-stacktrace=never
