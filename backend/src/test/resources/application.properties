spring.application.name=subscription-tracker
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=test-secret-that-is-at-least-32-characters-long
app.jwt.expiration=PT1H
app.jwt.issuer=subscription-tracker
app.cors.allowed-origins=http://localhost:5173
app.default-currency=TRY
app.billing.update-cron=-
app.reminders.cron=-
app.tokens.cleanup-cron=-
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.rate-limit.max-requests=1000
app.frontend-url=http://localhost:5173
